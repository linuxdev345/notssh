# Local UDP interface parameters between notssh and 1kbit-transport.
[udp]
# Address where notssh receives frames from the transport.
read_addr = '127.0.0.1:42003'
# Address where notssh sends frames to the transport.
write_addr = '127.0.0.1:42004'
# Maximum amount of terminal data in one notssh frame.
max_payload = 64
